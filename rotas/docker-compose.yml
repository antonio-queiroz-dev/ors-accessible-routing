services:
  ors:
    image: openrouteservice/openrouteservice:${ORS_VERSAO:-v10.1.0}
    container_name: rotas-ors
    # Sem "ports": o ORS só é acessível pela rede interna, atrás da API.
    # Para acessar direto (medir.sh), usar também o docker-compose.medir.yml
    environment:
      ORS_CONFIG_LOCATION: /config/ors-config.yml
      REBUILD_GRAPHS: ${ORS_REBUILD:-false}
      XMS: ${ORS_XMS:-256m}
      XMX: ${ORS_XMX:-2g}
      ORS_PERFIL_FOOT_WALKING: ${ORS_PERFIL_FOOT_WALKING:-true}
      ORS_PERFIL_WHEELCHAIR: ${ORS_PERFIL_WHEELCHAIR:-false}
      ors.engine.profile_default.build.source_file: /osm/${ORS_PBF:-salvador.osm.pbf}
    volumes:
      - ./ors/ors-config.yml:/config/ors-config.yml:ro
      - ./dados/osm:/osm:ro
      - ors-graphs:/home/ors/graphs
      - ors-elevation:/home/ors/elevation_cache
      - ors-logs:/home/ors/logs

  api:
    build: ./api
    container_name: rotas-api
    ports:
      - "${API_PORTA:-8080}:8080"
    environment:
      ORS_URL: http://ors:8082/ors
      JAVA_OPTS: ${API_JAVA_OPTS:--Xmx384m}
      DB_ARQUIVO: /data/rotas
      # Fuso usado nas datas devolvidas pela API
      TZ: ${API_FUSO:-America/Bahia}
      OBSTACULOS_TESTE: ${OBSTACULOS_TESTE:-false}
      ROTA_CONFIANCA_MINIMA: ${ROTA_CONFIANCA_MINIMA:-0.6}
      ROTA_LADO_QUADRADO_METROS: ${ROTA_LADO_QUADRADO_METROS:-12}
      ROTA_DESVIO_PERCENTUAL: ${ROTA_DESVIO_PERCENTUAL:-30}
      ROTA_DESVIO_PISO_METROS: ${ROTA_DESVIO_PISO_METROS:-100}
    volumes:
      - api-dados:/data
    depends_on:
      ors:
        condition: service_healthy

volumes:
  ors-graphs:
  ors-elevation:
  ors-logs:
  api-dados:
